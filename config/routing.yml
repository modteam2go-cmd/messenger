# Canonical page URLs use /messenger with query params (?partner_id=, ?group_id=, ?compose=1)
# so relative board menu links keep resolving at app.php depth.
negentiendertien_messenger_roster:
    path: /messenger
    defaults: { _controller: negentiendertien.messenger.controller.main:roster }

# Legacy path routes — redirect to query-string URLs above.
negentiendertien_messenger_chat:
    path: /messenger/chat/{partner_id}
    defaults: { _controller: negentiendertien.messenger.controller.main:chat }
    requirements:
        partner_id: \d+

